<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShadowSensor{% endblock %}</title>
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/main.css?v=6b4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="Toggle navigation">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">⬡ ShadowSensor</div>
    <nav class="sidebar-nav">
      <a href="/dashboard/home" class="{% if active_page == 'home' %}active{% endif %}">
        <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
      </a>
      <a href="/dashboard/alerts" class="{% if active_page == 'alerts' %}active{% endif %}">
        <span class="nav-icon">🔔</span><span class="nav-label">Alert Feed</span>
      </a>
      <a href="/dashboard/events" class="{% if active_page == 'events' %}active{% endif %}">
        <span class="nav-icon">📋</span><span class="nav-label">Event Explorer</span>
      </a>
      <a href="/dashboard/process-tree" class="{% if active_page == 'process_tree' %}active{% endif %}">
        <span class="nav-icon">🌳</span><span class="nav-label">Process Tree</span>
      </a>
      <a href="/dashboard/search" class="{% if active_page == 'search' %}active{% endif %}">
        <span class="nav-icon">🔍</span><span class="nav-label">Query Console</span>
      </a>
      <a href="/dashboard/ml-insights" class="{% if active_page == 'ml_insights' %}active{% endif %}">
        <span class="nav-icon">🧠</span><span class="nav-label">ML Insights</span>
      </a>
      <a href="/dashboard/rules" class="{% if active_page == 'rules' %}active{% endif %}">
        <span class="nav-icon">📜</span><span class="nav-label">Rules Library</span>
      </a>
      <a href="/dashboard/killchain" class="{% if active_page == 'killchain' %}active{% endif %}">
        <span class="nav-icon">🛡️</span><span class="nav-label">Kill Chain</span>
      </a>
      <a href="/dashboard/settings" class="{% if active_page == 'settings' %}active{% endif %}">
        <span class="nav-icon">⚙</span><span class="nav-label">Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button id="theme-toggle-btn" type="button" onclick="toggleTheme()">
        <span class="theme-icon">☀</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div id="htmx-error-banner" class="error-banner" style="display:none"></div>
    <div class="page-header">
      <div class="page-header-left">{% block page_title %}<h1>Dashboard</h1>{% endblock %}</div>
      <div class="page-header-right">
        <div class="time-range-picker">
          <div class="quick-btns">
            <button type="button" onclick="TimeRange.setQuick('15m')" class="quick-btn" data-range="15m">15m</button>
            <button type="button" onclick="TimeRange.setQuick('1h')" class="quick-btn" data-range="1h">1h</button>
            <button type="button" onclick="TimeRange.setQuick('6h')" class="quick-btn" data-range="6h">6h</button>
            <button type="button" onclick="TimeRange.setQuick('24h')" class="quick-btn" data-range="24h">24h</button>
            <button type="button" onclick="TimeRange.setQuick('7d')" class="quick-btn" data-range="7d">7d</button>
            <button type="button" onclick="TimeRange.setQuick('30d')" class="quick-btn" data-range="30d">30d</button>
          </div>
          <div class="custom-range">
            <input type="text" id="fp-start" placeholder="Start" class="datetime-input">
            <span>→</span>
            <input type="text" id="fp-end" placeholder="End" class="datetime-input">
            <button type="button" onclick="applyCustomRange()" class="btn-primary btn-sm">Apply</button>
          </div>
          <span id="time-range-display" class="time-range-label">Last 24 hours</span>
        </div>
      </div>
    </div>
    <div id="time-range-hidden" style="display:none">
      <input type="hidden" id="param-quick" name="quick" value="">
      <input type="hidden" id="param-from" name="from" value="">
      <input type="hidden" id="param-to" name="to" value="">
    </div>
    {% block content %}{% endblock %}
  </main>

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="/static/js/time_range.js"></script>
  <script src="/static/js/charts.js"></script>
  <script>
    TimeRange.init();
    const fpStart = flatpickr('#fp-start', { enableTime: true, dateFormat: 'Y-m-d\\TH:i:S', time_24hr: true });
    const fpEnd = flatpickr('#fp-end', { enableTime: true, dateFormat: 'Y-m-d\\TH:i:S', time_24hr: true });
    function applyCustomRange() {
      const f = fpStart.input.value;
      const t = fpEnd.input.value;
      if (!f || !t) { return; }
      TimeRange.setCustom(f, t);
    }
    document.body.addEventListener('htmx:responseError', function(evt) {
      const b = document.getElementById('htmx-error-banner');
      if (b) {
        b.textContent = 'Request failed: ' + evt.detail.xhr.status + ' ' + evt.detail.xhr.statusText;
        b.style.display = 'block';
        setTimeout(function() { b.style.display = 'none'; }, 5000);
      }
    });
    document.body.addEventListener('htmx:beforeRequest', function(e) {
      e.detail.target?.classList.add('loading');
    });
    document.body.addEventListener('htmx:afterRequest', function(e) {
      e.detail.target?.classList.remove('loading');
    });
    document.getElementById('hamburger-btn')?.addEventListener('click', function() {
      document.getElementById('sidebar')?.classList.toggle('open');
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
