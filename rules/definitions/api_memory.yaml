- id: API_CRT_SUSPICIOUS_SOURCE_001
  name: CreateRemoteThread from Suspicious Source Process
  description: >
    Detects process injection via CreateRemoteThread where the source process
    is a known suspicious category — Office applications, script engines,
    LOLBins, browsers, or system utilities with no legitimate injection use
    case. These processes have no business issuing CreateRemoteThread calls.
    Fires regardless of target identity to catch injections even when Sysmon
    fails to resolve the target process name (known environmental limitation).
    Sourced from SigmaHQ sysmon_suspicious_remote_thread.yml (community-
    validated process list) cross-referenced against DFIR Report incident data
    and MITRE ATT&CK T1055 campaign documentation.
  mitre_technique: T1055
  mitre_tactic: Defense Evasion
  severity: Critical
  event_ids: [8]
  logic: AND
  conditions:
    - field: source_image
      operator: ends_with_any
      values:
        - '\winword.exe'       # Office — documented Emotet/QakBot/TrickBot source
        - '\excel.exe'         # Office
        - '\powerpnt.exe'      # Office
        - '\outlook.exe'       # Office
        - '\lync.exe'          # Office/Lync
        - '\mspaint.exe'       # Utility — no injection use case
        - '\powershell.exe'    # Script engine — primary fileless threat vector
        - '\wscript.exe'       # Script engine — documented QakBot/Emotet source
        - '\mshta.exe'         # Script engine — documented Emotet LOLBin source
        - '\msiexec.exe'       # LOLBin — T1218.007
        - '\regsvr32.exe'      # LOLBin — T1218.010
        - '\wmic.exe'          # LOLBin — T1047
        - '\installutil.exe'   # LOLBin — T1218.004
        - '\schtasks.exe'      # LOLBin — T1053.005
        - '\iexplore.exe'      # Browser — documented injection source
        - '\msbuild.exe'       # Build tool — documented LOLBin abuse
        - '\cvtres.exe'        # Build tool — documented abuse
        - '\vssadmin.exe'      # Utility — documented ransomware abuse
        - '\find.exe'          # Utility — no injection use case
        - '\findstr.exe'       # Utility — no injection use case
        - '\forfiles.exe'      # Utility — T1059 abuse documented
        - '\expand.exe'        # Utility — no injection use case
        - '\defrag.exe'        # Utility — no injection use case
        - '\ping.exe'          # Utility — no injection use case
        - '\robocopy.exe'      # Utility — no injection use case
        - '\makecab.exe'       # Utility — no injection use case
        - '\gpupdate.exe'      # Utility — no injection use case
        - '\hh.exe'            # LOLBin — T1218 documented
        - '\explorer.exe'      # Shell — documented post-compromise pivot source
        - '\monitoringhost.exe' # Documented .NET CLR injection target/source
    - field: source_image
      operator: not_contains
      value: 'python_runtime\python.exe'  # Exclude ShadowSensor's own pipeline

- id: API_CRT_SENSITIVE_TARGET_001
  name: CreateRemoteThread Targeting Sensitive System Process
  description: >
    Detects CreateRemoteThread where the target is a known sensitive system
    process (lsass.exe, winlogon.exe, csrss.exe) from any source not in the
    known-benign system process exclusion list. Catches novel or unknown
    injection sources targeting credential stores and authentication processes.
    Severity is High rather than Critical because source is not a confirmed
    suspicious process — this rule covers the unknown-source case.
    Complements API_CRT_SUSPICIOUS_SOURCE_001 which fires on known-suspicious
    sources regardless of target.
  mitre_technique: T1055
  mitre_tactic: Defense Evasion
  severity: High
  event_ids: [8]
  logic: AND
  conditions:
    - field: target_image
      operator: ends_with_any
      values:
        - '\lsass.exe'
        - '\winlogon.exe'
        - '\csrss.exe'
    - field: source_image
      operator: not_ends_with_any
      values:
        - '\csrss.exe'         # Windows session management
        - '\werfault.exe'      # Windows Error Reporting
        - '\svchost.exe'       # Windows service host
        - '\wmiprvse.exe'      # WMI Provider Host — confirmed FP source
        - '\vmtoolsd.exe'      # VMware Tools — confirmed FP source
        - '\MsMpEng.exe'       # Windows Defender
        - '\lsass.exe'         # LSASS self-reference
        - '\winlogon.exe'      # Winlogon self-reference
        - '\wininit.exe'       # Windows initialization
        - '\services.exe'      # Windows Service Control Manager
    - field: source_image
      operator: not_contains
      value: 'python_runtime\python.exe'  # Exclude ShadowSensor's own pipeline

- id: API_OPEN_PROCESS_SUSPICIOUS_ACCESS_001
  name: Suspicious OpenProcess targeting security-sensitive process
  description: >
    A process opened a security-sensitive system process (lsass, winlogon, csrss)
    with broad access rights commonly used in credential dumping or process injection.
    Legitimate system components that open these processes are explicitly excluded.
    Phase 2B redesign: target-centric logic replaces cross-basename matching, which
    fired on routine Windows activity (explorer->msedge, svchost->RuntimeBroker,
    services->svchost) during benign VM baseline runs.
  mitre_technique: T1055
  mitre_tactic: Defense Evasion
  severity: High
  event_ids: [10]
  logic: AND
  conditions:
    - field: granted_access
      operator: bits_any_set
      values:
        - "0x1f0fff"   # PROCESS_ALL_ACCESS — full access, classic Mimikatz pattern
        - "0x1410"     # PROCESS_VM_READ | PROCESS_CREATE_THREAD | PROCESS_DUP_HANDLE
        - "0x1fffff"   # PROCESS_ALL_ACCESS alternate form
    - field: target_image
      operator: ends_with_any
      values:
        - "lsass.exe"
        - "winlogon.exe"
        - "csrss.exe"
    - field: source_image
      operator: not_ends_with_any
      values:
        - "MsMpEng.exe"                                       # Windows Defender memory scanner — bare basename; path includes a
                                                                # version-numbered segment that changes on every Defender platform
                                                                # update, so it cannot be safely path-anchored. Known accepted
                                                                # residual masquerading gap — see research paper Section 2.
        - "\\Windows\\System32\\csrss.exe"                     # Windows session management
        - "\\Windows\\System32\\lsass.exe"                     # LSASS self-reference
        - "\\Windows\\System32\\winlogon.exe"                  # Windows logon process (opens lsass during authentication)
        - "\\Windows\\System32\\wininit.exe"                   # Windows initialization process (opens lsass during boot)
        - "\\Windows\\System32\\svchost.exe"                   # CONFIRMED FP — 2026-07-12, svchost->winlogon/lsass, 0x1fffff
        - "\\Windows\\System32\\wbem\\wmiprvse.exe"            # CONFIRMED FP — WMI Provider Host, 289 occurrences, 0x1410
        - "\\Program Files\\VMware\\VMware Tools\\vmtoolsd.exe" # CONFIRMED FP — VMware Tools guest integration, 10 occurrences

- id: API_DLL_LOAD_SUSPICIOUS_PATH_001
  name: Unsigned DLL Loaded from User-Writable Staging Path
  description: >
    Detects an unsigned DLL being loaded from a user-writable staging location:
    Temp, AppData, Downloads, or ProgramData. Legitimate DLLs loaded during
    normal process operation originate from System32, SysWOW64, or the
    application's own installation directory — they are also signed. A DLL that
    is both unsigned and located in a user-writable staging path is a strong
    indicator of reflective or manual map DLL injection, sideloading, or
    in-memory-to-disk staging. This is a cross-process corroboration signal:
    if a DLL appears here and an EID 10 event also fires for the same process,
    the combined confidence is very high.
  mitre_technique: T1055.001
  mitre_tactic: Defense Evasion
  severity: High
  event_ids: [7]
  logic: AND
  conditions:
    - field: image_loaded
      operator: contains_any
      values:
        - "\\temp\\"
        - "\\appdata\\local\\temp\\"
        - "\\appdata\\roaming\\"
        - "\\downloads\\"
        - "\\programdata\\"
        - "c:\\users\\public\\"
    - field: signed
      operator: equals
      value: "false"

- id: API_LOLBIN_DLL_UNSIGNED_001
  name: LOLBin Loading an Unsigned DLL
  description: >
    Detects a known LOLBin (rundll32, regsvr32, mshta, msiexec, cmstp) loading
    an unsigned DLL. These processes have no legitimate operational need to load
    unsigned DLLs — their legitimate usage is to load specific, signed system or
    application DLLs. When they load unsigned DLLs, it is a reliable indicator
    that they are being used as a signed-binary proxy to load attacker-controlled
    code, bypassing application whitelisting. This is the Image Load layer of
    corroboration for the Process Create layer detections in lolbins.yaml.
  mitre_technique: T1055.001
  mitre_tactic: Defense Evasion
  severity: High
  event_ids: [7]
  logic: AND
  conditions:
    - field: image
      operator: ends_with_any
      values:
        - "rundll32.exe"
        - "regsvr32.exe"
        - "mshta.exe"
        - "msiexec.exe"
        - "cmstp.exe"
    - field: signed
      operator: equals
      value: "false"

- id: API_OPEN_PROCESS_VM_WRITE_001
  name: Process Memory Write Access to Arbitrary Target Process
  description: >
    Detects processes requesting PROCESS_VM_WRITE access (0x0020) to another
    process. VM_WRITE is the core capability required for classic process injection:
    without it, an attacker cannot write shellcode or a DLL path into the target
    process's memory. The existing API_OPEN_PROCESS_SUSPICIOUS_ACCESS_001 rule
    targets PROCESS_ALL_ACCESS against security-sensitive processes (lsass, etc.).
    This rule is broader: it fires on any PROCESS_VM_WRITE or common injection
    access mask combinations against any target, from any non-system source.
    Access mask 0x0028 combines VM_WRITE with VM_OPERATION (needed to allocate
    memory in the target). 0x0038 adds VM_READ. Observed in virtually all injection
    techniques including classic DLL injection, process hollowing, and reflective loading.
  mitre_technique: T1055
  mitre_tactic: Defense Evasion
  severity: Critical
  event_ids: [10]
  logic: AND
  conditions:
    - field: granted_access
      operator: bits_any_set
      values:
        - "0x0020"     # PROCESS_VM_WRITE — memory write capability
        - "0x0028"     # PROCESS_VM_WRITE | PROCESS_VM_OPERATION
        - "0x0038"     # PROCESS_VM_WRITE | PROCESS_VM_OPERATION | PROCESS_VM_READ
        - "0x001f0fff" # PROCESS_ALL_ACCESS
        - "0x0021"     # PROCESS_VM_WRITE | PROCESS_CREATE_THREAD
    - field: source_image
      operator: not_ends_with_any
      values:
        - "msmpeng.exe"
        - "csrss.exe"
        - "lsass.exe"
        - "winlogon.exe"
        - "wininit.exe"
        - "werfault.exe"
        - "svchost.exe"

- id: API_TOKEN_MANIPULATION_001
  name: Process Handle Duplication for Token Theft
  description: >
    Detects processes requesting PROCESS_DUP_HANDLE (0x0040) access to security-
    sensitive system processes. PROCESS_DUP_HANDLE is the access right needed to
    duplicate a handle from another process — specifically, to steal a privileged
    token from LSASS, Services, or Winlogon to impersonate a higher-privileged
    context. This is the key access mask in token theft and impersonation attacks
    (T1134). The target is restricted to processes that hold privileged tokens:
    lsass (SYSTEM token), winlogon (SYSTEM/privileged session tokens), and
    services.exe (service account tokens). Observed in Incognito, Cobalt Strike's
    steal_token command, and PowerSploit's Invoke-TokenManipulation.
  mitre_technique: T1134
  mitre_tactic: Defense Evasion
  severity: High
  event_ids: [10]
  logic: AND
  conditions:
    - field: granted_access
      operator: bits_any_set
      values:
        - "0x0040"   # PROCESS_DUP_HANDLE — token manipulation capability
        - "0x0440"   # PROCESS_DUP_HANDLE | PROCESS_QUERY_INFORMATION
        - "0x1440"   # PROCESS_DUP_HANDLE | PROCESS_QUERY_INFORMATION | extra
    - field: target_image
      operator: ends_with_any
      values:
        - "lsass.exe"
        - "winlogon.exe"
        - "services.exe"
    - field: source_image
      operator: not_ends_with_any
      values:
        - "msmpeng.exe"
        - "csrss.exe"
        - "lsass.exe"
        - "winlogon.exe"
        - "wininit.exe"

- id: API_AV_PROCESS_ACCESS_001
  name: Non-System Process Accessing Security Software Process
  description: >
    Detects a non-system process opening a known AV or security agent process
    with access rights sufficient to terminate or write to it. Security software
    termination (T1562.001) requires PROCESS_TERMINATE (0x0001) or broader access.
    Legitimate interactions with AV processes are performed exclusively by Windows
    Update, the Windows Service Control Manager (services.exe), svchost.exe, and
    TrustedInstaller.exe — all of which are excluded. Any other process opening
    AV/EDR agent processes with broad access rights is attempting to disable or
    circumvent security tooling. AV process names listed cover Windows Defender,
    ESET, Kaspersky, Bitdefender, Avast, and SentinelOne.
  mitre_technique: T1562.001
  mitre_tactic: Defense Evasion
  severity: High
  event_ids: [10]
  logic: AND
  conditions:
    - field: target_image
      operator: ends_with_any
      values:
        - "msmpeng.exe"
        - "mpcmdrun.exe"
        - "avgnt.exe"
        - "avp.exe"
        - "bdagent.exe"
        - "ekrn.exe"
        - "sentinelagent.exe"
        - "cylancesvc.exe"
        - "cb.exe"
    - field: granted_access
      operator: bits_any_set
      values:
        - "0x0001"
        - "0x0020"
    - field: source_image
      operator: not_ends_with_any
      values:
        - "msmpeng.exe"
        - "svchost.exe"
        - "services.exe"
        - "trustedinstaller.exe"
        - "tiworker.exe"
        - "sgrmbroker.exe"
        - "wuauclt.exe"
        - "csrss.exe"
        - "conhost.exe"
        - "lsass.exe"
        - "winlogon.exe"
        - "wininit.exe"
