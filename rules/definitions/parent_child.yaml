- id: CHAIN_OFFICE_POWERSHELL_001
  name: Office Application Spawning PowerShell
  description: >
    Detects a Microsoft Office application launching PowerShell,
    a high-confidence indicator of macro-based fileless execution.
  mitre_technique: T1566.001
  mitre_tactic: Initial Access
  severity: High
  event_ids: [1]
  logic: AND
  conditions:
    - field: parent_image
      operator: contains_any
      values:
        - "winword.exe"
        - "excel.exe"
        - "powerpnt.exe"
        - "outlook.exe"
        - "onenote.exe"
    - field: image
      operator: ends_with
      value: "powershell.exe"

