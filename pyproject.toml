[tool.ruff]
line-length = 100
target-version = "py311"
src = ["collector", "normalizer", "rules", "storage", "dashboard", "alerting", "ml", "service", "evaluation", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
pythonpath = ["."]

[project]
name = "shadowsensor"
version = "0.3.0"
dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "lark>=1.1.9",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
]